<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Students learning online">
  <defs>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE3FB"/>
      <stop offset="1" stop-color="#DCC9F6"/>
    </linearGradient>
  </defs>

  <!-- soft background blob -->
  <path fill="url(#blob)" d="M460 70c40 40 70 110 50 180s-90 120-180 140-200 10-250-50S20 240 60 160 200 40 290 36s130-6 170 34Z"/>

  <!-- whiteboard / screen -->
  <rect x="300" y="92" width="190" height="130" rx="10" fill="#ffffff" stroke="#6A2FB5" stroke-width="4"/>
  <rect x="318" y="112" width="120" height="12" rx="6" fill="#C9A8EE"/>
  <rect x="318" y="136" width="154" height="10" rx="5" fill="#E2D2F4"/>
  <rect x="318" y="156" width="138" height="10" rx="5" fill="#E2D2F4"/>
  <circle cx="452" cy="190" r="16" fill="#F26A21"/>
  <path d="M446 190h12M452 184v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <!-- teacher figure -->
  <g>
    <circle cx="250" cy="150" r="22" fill="#7A4A2B"/>
    <path d="M226 150a24 24 0 0 1 48 0Z" fill="#3A2417"/>
    <rect x="232" y="172" width="36" height="70" rx="14" fill="#6A2FB5"/>
    <rect x="240" y="242" width="12" height="46" rx="6" fill="#33264A"/>
    <rect x="256" y="242" width="12" height="46" rx="6" fill="#33264A"/>
    <rect x="262" y="178" width="50" height="12" rx="6" fill="#7A4A2B"/>
  </g>

  <!-- two seated students -->
  <g>
    <circle cx="120" cy="232" r="18" fill="#B5651D"/>
    <rect x="104" y="250" width="32" height="48" rx="12" fill="#F26A21"/>
  </g>
  <g>
    <circle cx="170" cy="240" r="18" fill="#8C5A2B"/>
    <rect x="154" y="258" width="32" height="42" rx="12" fill="#8B3FD8"/>
  </g>

  <!-- floor line -->
  <rect x="60" y="300" width="430" height="6" rx="3" fill="#C9A8EE"/>

  <!-- floating dots -->
  <circle cx="120" cy="110" r="7" fill="#8B3FD8"/>
  <circle cx="500" cy="280" r="9" fill="#F26A21"/>
  <circle cx="90"  cy="180" r="5" fill="#F26A21"/>
</svg>
